<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWAAZ.FSD - Faisalabad Ki Awaz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f8f6}
header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px}
.card{background:#fff;max-width:500px;margin:25px auto;padding:24px;border-radius:20px;box-shadow:0 4px 20px #0001}
h2{margin-bottom:12px}
select,input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:12px;font-size:15px}
button{width:100%;padding:15px;background:#0f7a3c;color:#fff;border:0;border-radius:12px;font-weight:700;font-size:16px;margin-top:10px}
.badge{display:inline-block;background:#e8f5e9;color:#0f7a3c;padding:6px 12px;border-radius:20px;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<header>
<div class="logo">📢 AWAAZ.FSD</div>
<div style="font-size:13px;opacity:.8">Faisalabad</div>
</header>
<div class="card">
<h2>Faisalabad Ka Masla Report Karo 🏙️</h2>
<p style="color:#666;font-size:14px;margin-bottom:15px">Kachra, Gutter, Road, Light ka masla fori report karein</p>
<select><option>🗑️ Garbage / Kachra</option><option>💧 Sewage / Gutter</option><option>🛣️ Road Damage</option><option>💡 Street Light</option><option>🚰 Water Issue</option></select>
<input placeholder="📍 Location - e.g Peoples Colony, Jaranwala Road">
<textarea rows="3" placeholder="Masla kya hai? Detail likhein..."></textarea>
<input type="file" accept="image/*">
<button>🚀 Report Submit Karo</button>
<center><span class="badge">✅ AWAAZ.FSD LIVE Hai</span></center>
</div>
</body>
</html>
